# === SERVER CONFIGURATION ===
server:
  port: 8181
  servlet:
    context-path: /api/v1

spring:
  rsocket:
    server:
      port: 7000
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  application:
    name: sakila-rest
  config:
    import:
      - optional:classpath:db-${DB_SYSTEM}.yml
      - dotenv:.env

  # === SECURITY CONFIGURATION ===
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${auth0.issuer}

  # === DATABASE CONFIGURATION ===
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true

  # === JPA / HIBERNATE CONFIGURATION ===
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  # === JACKSON (JSON) CONFIGURATION ===
  jackson:
    serialization:
      indent_output: true
    default-property-inclusion: non_null

  # === CACHING ===
  data:
    redis:
      host: ${DATA_REDIS_HOST}
      port: ${DATA_REDIS_PORT}
      username: ${DATA_REDIS_USERNAME}
      password: ${DATA_REDIS_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false
      use-key-prefix: true

# === SWAGGER CONFIGURATION ===
springdoc:
  swagger-ui:
    path: /docs

# === BUGSNAG CONFIGURATION ===
bugsnag:
  key: ${BUGSNAG_API_KEY}

# === DISCORD CONFIGURATION ===
discord:
  name: ${spring.application.name}
  webhook-url: ${DISCORD_WEBHOOK_URL}

# === S3 CONFIGURATION ===
s3:
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  access-key: ${S3_ACCESS_KEY_ID}
  secret-key: ${S3_SECRET_ACCESS_KEY}
  url: ${S3_URL}

# === AUTH0 CONFIGURATION ===
auth0:
  domain: ${AUTH0_DOMAIN}
  issuer: ${AUTH0_ISSUER}
  audience: ${AUTH0_AUDIENCE}
  mgmt-client-id: ${AUTH0_MGMT_CLIENT_ID}
  mgmt-client-secret: ${AUTH0_MGMT_CLIENT_SECRET}
  app-client-id: ${AUTH0_APP_CLIENT_ID}
  app-client-secret: ${AUTH0_APP_CLIENT_SECRET}
  connection: Username-Password-Authentication
